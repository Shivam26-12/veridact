[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
# Pre-existing deprecations from the application itself (Python 3.14 / FastAPI),
# not from the test suite. Silenced so real failures stay visible.
filterwarnings =
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning
    ignore:(?s).*on_event is deprecated.*:DeprecationWarning
